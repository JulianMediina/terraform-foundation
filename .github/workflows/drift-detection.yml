name: drift-detection

on:
  schedule:
    - cron: "0 12 * * *" # diario, 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: us-east-1
  TF_VAR_github_org: ${{ github.repository_owner }}
  TF_VAR_budget_notification_emails: ${{ vars.BUDGET_NOTIFICATION_EMAILS }}

jobs:
  detect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bootstrap
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configurar credenciales AWS (arranque)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.FOUNDATION_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.FOUNDATION_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Asegurar backend remoto (idempotente)
        run: ../scripts/ensure-backend.sh

      - run: terraform init -input=false

      - name: terraform plan (detailed-exitcode)
        id: plan
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -no-color -out=/dev/null
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Abrir incidencia si hay drift
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Drift detectado en foundation",
              labels: ["drift"],
              body: "El plan programado detectó diferencias entre el estado de Terraform y la infraestructura real del bootstrap. Revisar el log del workflow y correr `terraform plan` localmente (o vía PR) para diagnosticar antes de aplicar.",
            });

      - name: Fallar si el plan tuvo un error real
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1

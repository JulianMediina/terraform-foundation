name: foundation-apply

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: us-east-1
  TF_VAR_github_org: ${{ github.repository_owner }}
  TF_VAR_budget_notification_emails: ${{ secrets.BUDGET_NOTIFICATION_EMAILS }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: foundation
    defaults:
      run:
        working-directory: bootstrap
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # El proveedor OIDC y el rol gha-foundation ya existen (los creó el
      # primer bootstrap con la credencial estática, hace tiempo) — este
      # pipeline ya no necesita esa credencial para nada, ni siquiera para
      # aplicarse cambios a sí mismo.
      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Asegurar backend remoto (idempotente)
        run: ../scripts/ensure-backend.sh

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        run: terraform apply -input=false -auto-approve

      # Confirma que el apply dejó todo exactamente como el plan decía. Sin
      # smoke test HTTP acá -foundation no expone nada propio, a diferencia
      # de terraform-live- así que la validación es puramente "sin drift".
      - name: validar post-apply (sin drift)
        id: postcheck
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -no-color -out=/dev/null
          echo "drift_exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      # Rollback automático en el MISMO job: ya tiene la sesión OIDC de este
      # apply, restaurar la configuración anterior no pasa de nuevo por el
      # gate de aprobación. Nunca toca el .tfstate directamente.
      - name: rollback automático (re-aplicar la configuración anterior)
        id: rollback
        if: steps.postcheck.outputs.drift_exit == '2'
        run: |
          git checkout "${{ github.event.before }}" -- .
          terraform init -input=false -reconfigure
          terraform apply -input=false -auto-approve

      - name: abrir PR de reversión (para que el código coincida)
        if: steps.rollback.outcome == 'success'
        run: |
          git config user.name "daviplata-ci"
          git config user.email "ci@daviplata.local"
          # El paso de rollback de arriba dejó el working tree Y el índice
          # con la configuración anterior sin commitear (git checkout <ref>
          # -- . también deja el índice modificado; "git checkout -- ."
          # solo, sin ref, no lo deshace porque reconstruye desde ese mismo
          # índice). Hace falta un reset --hard para limpiar los dos.
          git reset --hard HEAD
          revert_branch="auto-revert/foundation-${{ github.run_id }}"
          git checkout -b "$revert_branch" "${{ github.sha }}"
          git revert --no-edit "${{ github.sha }}"
          git push origin "$revert_branch"
          gh pr create --repo "${{ github.repository }}" \
            --base main --head "$revert_branch" \
            --title "Reversión automática: foundation falló la validación post-apply" \
            --body "El apply de foundation (commit ${{ github.sha }}) no pasó la validación post-despliegue. La infraestructura ya fue restaurada automáticamente a la versión anterior en el mismo run; este PR solo actualiza el código para que coincida con lo que está aplicado de verdad. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: notificar por correo (SNS)
        if: always()
        run: |
          topic_arn=$(terraform output -raw foundation_pipeline_sns_topic_arn 2>/dev/null || echo "")
          if [ -z "$topic_arn" ]; then
            echo "sin sns_topic_arn disponible, omito notificación"
            exit 0
          fi
          if [ "${{ steps.rollback.outcome }}" = "success" ]; then
            resultado="rollback automático (post-apply falló)"
          elif [ "${{ job.status }}" = "success" ]; then
            resultado="success"
          else
            resultado="failure"
          fi
          message=$(printf 'Repo: terraform-foundation\nResultado: %s\nCommit: %s\nRun: %s' \
            "$resultado" \
            "${{ github.sha }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          aws sns publish \
            --topic-arn "$topic_arn" \
            --subject "foundation-apply: ${resultado}" \
            --message "$message"

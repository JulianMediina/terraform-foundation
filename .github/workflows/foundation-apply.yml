name: foundation-apply

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: us-east-1
  TF_VAR_github_org: ${{ github.repository_owner }}
  TF_VAR_budget_notification_emails: ${{ vars.BUDGET_NOTIFICATION_EMAILS }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: foundation
    defaults:
      run:
        working-directory: bootstrap
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # El proveedor OIDC y el rol gha-foundation ya existen (los creó el
      # primer bootstrap con la credencial estática, hace tiempo) — este
      # pipeline ya no necesita esa credencial para nada, ni siquiera para
      # aplicarse cambios a sí mismo.
      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Asegurar backend remoto (idempotente)
        run: ../scripts/ensure-backend.sh

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        run: terraform apply -input=false -auto-approve
